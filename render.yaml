services:
  - type: web
    name: bcare-sa-ew9u5m
    runtime: static
    buildCommand: echo ready
    staticPublishPath: ./bcare-srv1
    headers:
      - path: /*
        name: Permissions-Policy
        value: otp-credentials=(self)
    routes:
